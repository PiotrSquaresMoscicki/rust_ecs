[package]
name = "rust_ecs"
version = "0.1.0"
edition = "2021"

[dependencies]
paste = "1.0"
rand = "0.8"
rust_ecs_derive = { path = "./rust_ecs_derive" }
chrono = { version = "0.4", features = ["serde"] }
ctrlc = "3.4"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
lz4 = "1.28"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "game_benchmarks"
harness = false
required-features = []

[[bin]]
name = "replay_benchmark"
path = "src/bin/replay_benchmark.rs"

