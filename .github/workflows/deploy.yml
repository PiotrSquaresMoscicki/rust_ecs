name: Deploy WebAssembly Demo

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-wasm:
    name: Build WebAssembly
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.artifact.outputs.artifact-name }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: stable
        targets: wasm32-unknown-unknown

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-cargo-registry-

    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-cargo-index-

    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-wasm-${{ hashFiles('**/Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-cargo-build-target-wasm-

    - name: Cache wasm-pack
      uses: actions/cache@v4
      with:
        path: ~/.cargo/bin/wasm-pack
        key: ${{ runner.os }}-wasm-pack
        restore-keys: |
          ${{ runner.os }}-wasm-pack

    - name: Install wasm-pack
      run: |
        if [ ! -f ~/.cargo/bin/wasm-pack ]; then
          echo "Installing wasm-pack..."
          cargo install wasm-pack
        else
          echo "wasm-pack already cached"
        fi

    - name: Build WebAssembly
      run: |
        echo "Building WebAssembly..."
        wasm-pack build --target web --out-dir www/pkg --release
        echo "Build completed successfully"
        ls -la www/pkg/

    - name: Verify build artifacts
      run: |
        echo "Verifying WebAssembly build artifacts..."
        if [ ! -f "www/pkg/rust_ecs.js" ]; then
          echo "❌ Missing rust_ecs.js"
          exit 1
        fi
        if [ ! -f "www/pkg/rust_ecs_bg.wasm" ]; then
          echo "❌ Missing rust_ecs_bg.wasm"
          exit 1
        fi
        if [ ! -f "www/index.html" ]; then
          echo "❌ Missing index.html"
          exit 1
        fi
        echo "✅ All required artifacts are present"

    - name: Prepare deployment files
      id: artifact
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          # Add PR info banner for PR previews
          sed -i 's|<div class="container">|<div class="container"><div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 15px; margin: -30px -30px 20px -30px; border-radius: 8px 8px 0 0; text-align: center;"><h3 style="margin: 0; color: white;">📋 PR Preview #${{ github.event.number }}</h3><p style="margin: 5px 0 0 0; opacity: 0.9;">Preview for: <a href="${{ github.event.pull_request.html_url }}" target="_blank" style="color: #fff; text-decoration: underline;">${{ github.event.pull_request.title }}</a></p></div>|' www/index.html
          echo "artifact-name=wasm-demo-pr-${{ github.event.number }}" >> $GITHUB_OUTPUT
        else
          echo "artifact-name=wasm-demo-main" >> $GITHUB_OUTPUT
        fi
        echo "Prepared deployment files for: $(cat $GITHUB_OUTPUT | grep artifact-name | cut -d'=' -f2)"

    - name: Upload WebAssembly artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.artifact.outputs.artifact-name }}
        path: www/
        retention-days: 30

  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-wasm
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Download WebAssembly artifacts
      uses: actions/download-artifact@v4
      with:
        name: ${{ needs.build-wasm.outputs.artifact-name }}
        path: ./public

    - name: Verify downloaded artifacts
      run: |
        echo "Verifying downloaded artifacts for GitHub Pages..."
        ls -la ./public/
        if [ ! -f "./public/index.html" ]; then
          echo "❌ Missing index.html in public/"
          exit 1
        fi
        if [ ! -d "./public/pkg" ]; then
          echo "❌ Missing pkg/ directory in public/"
          exit 1
        fi
        echo "✅ GitHub Pages artifacts verified"

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload to GitHub Pages
      uses: actions/upload-pages-artifact@v4
      with:
        path: ./public

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  deploy-pr-preview:
    name: Deploy PR Preview
    runs-on: ubuntu-latest
    needs: build-wasm
    if: github.event_name == 'pull_request'
    outputs:
      preview-url: ${{ steps.netlify-deploy.outputs.deploy-url }}
      deployment-status: ${{ steps.netlify-deploy.outcome }}
    steps:
    - name: Download WebAssembly artifacts
      uses: actions/download-artifact@v4
      with:
        name: ${{ needs.build-wasm.outputs.artifact-name }}
        path: ./preview

    - name: Verify preview artifacts
      run: |
        echo "Verifying preview artifacts..."
        ls -la ./preview/
        if [ ! -f "./preview/index.html" ]; then
          echo "❌ Missing index.html in preview/"
          exit 1
        fi
        if [ ! -d "./preview/pkg" ]; then
          echo "❌ Missing pkg/ directory in preview/"
          exit 1
        fi
        echo "✅ Preview artifacts verified"

    - name: Deploy to Netlify
      id: netlify-deploy
      uses: nwtgck/actions-netlify@v3.0
      with:
        publish-dir: './preview'
        production-deploy: false
        github-token: ${{ secrets.GITHUB_TOKEN }}
        deploy-message: "Deploy from GitHub Actions - PR #${{ github.event.number }}: ${{ github.event.pull_request.title }}"
        alias: "rust-ecs-pr-${{ github.event.number }}"
        enable-pull-request-comment: false
        enable-commit-comment: false
        overwrites-pull-request-comment: false
      env:
        NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      timeout-minutes: 10
      continue-on-error: true

    - name: Debug deployment outputs
      run: |
        echo "Netlify deployment outputs:"
        echo "Deploy URL: ${{ steps.netlify-deploy.outputs.deploy-url }}"
        echo "Outcome: ${{ steps.netlify-deploy.outcome }}"

  comment-pr:
    name: Comment on PR
    runs-on: ubuntu-latest
    needs: [build-wasm, deploy-pr-preview]
    if: github.event_name == 'pull_request' && always()
    steps:
    - name: Comment PR with deployment status
      uses: actions/github-script@v7
      with:
        script: |
          const buildStatus = '${{ needs.build-wasm.result }}' === 'success' ? '✅ Build Successful' : '❌ Build Failed';
          const deployStatus = '${{ needs.deploy-pr-preview.result }}' === 'success' ? '✅ Deployment Successful' : '⚠️ Deployment Failed';
          const previewUrl = '${{ needs.deploy-pr-preview.outputs.preview-url }}';
          
          console.log('Build result:', '${{ needs.build-wasm.result }}');
          console.log('Deploy result:', '${{ needs.deploy-pr-preview.result }}');
          console.log('Preview URL:', previewUrl);
          console.log('Deployment status:', '${{ needs.deploy-pr-preview.outputs.deployment-status }}');
          
          let deploymentSection = '';
          if ('${{ needs.deploy-pr-preview.outputs.deployment-status }}' === 'success' && previewUrl && previewUrl !== 'undefined' && previewUrl !== '') {
            deploymentSection = `
          ## 🌐 Live Preview Available
          
          **🔗 [View Live Demo](${previewUrl})**
          
          The WebAssembly demo is now live and ready for testing!`;
          } else if ('${{ secrets.NETLIFY_AUTH_TOKEN }}' === '' || '${{ secrets.NETLIFY_SITE_ID }}' === '') {
            deploymentSection = `
          ## 📦 Deployment Artifacts Available
          
          **Preview deployment requires Netlify configuration.** You can still test the demo:
          
          1. Download the \`${{ needs.build-wasm.outputs.artifact-name }}\` artifact from this workflow run
          2. Extract and serve locally: \`python3 -m http.server 8000\`
          3. Visit \`http://localhost:8000\`
          
          **To enable live previews:**
          - Set up a Netlify site and configure \`NETLIFY_AUTH_TOKEN\` and \`NETLIFY_SITE_ID\` secrets`;
          } else {
            deploymentSection = `
          ## ⚠️ Deployment Issue
          
          The build completed successfully, but deployment failed. You can still test manually:
          
          1. Download the \`${{ needs.build-wasm.outputs.artifact-name }}\` artifact from this workflow run
          2. Extract and serve locally: \`python3 -m http.server 8000\`
          3. Visit \`http://localhost:8000\`
          
          **Debug Info:**
          - Build Status: ${{ needs.build-wasm.result }}
          - Deploy Status: ${{ needs.deploy-pr-preview.result }}
          - Preview URL: ${previewUrl || 'Not available'}`;
          }
          
          const comment = `## 🦀 WebAssembly Demo - PR #${{ github.event.number }}
          
          **Build Status:** ${buildStatus}
          **Deployment Status:** ${deployStatus}
          ${deploymentSection}
          
          ### ✨ Demo Features
          - 🌟 Hello World from Rust WebAssembly  
          - 🎮 Interactive greeting function
          - 🏗️ ECS World and Entity creation demo
          - 📝 Real-time console output
          - 🎨 Responsive web interface
          
          ### 🔧 Testing Instructions
          Open the preview link above, then:
          1. Check browser console for Rust log messages
          2. Try the "Greet from Rust" button with your name
          3. Click "Run ECS Demo" to see entity creation
          4. All output appears in both the console and on-page display
          
          ---
          *🤖 Auto-generated by GitHub Actions • [View Workflow Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})*`;
          
          // Find existing comment to update
          const comments = await github.rest.issues.listComments({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
          });
          
          const existingComment = comments.data.find(comment => 
            comment.body.includes('🦀 WebAssembly Demo - PR #${{ github.event.number }}')
          );
          
          if (existingComment) {
            // Update existing comment
            await github.rest.issues.updateComment({
              comment_id: existingComment.id,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
            console.log('Updated existing comment');
          } else {
            // Create new comment
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
            console.log('Created new comment');
          }