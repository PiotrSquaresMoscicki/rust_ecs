name: Deploy WebAssembly Demo

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-wasm:
    name: Build WebAssembly
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.artifact.outputs.artifact-name }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        targets: wasm32-unknown-unknown

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-cargo-registry-

    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-cargo-index-

    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-wasm-${{ hashFiles('**/Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-cargo-build-target-wasm-

    - name: Install wasm-pack
      run: cargo install wasm-pack

    - name: Build WebAssembly
      run: |
        wasm-pack build --target web --out-dir www/pkg --release

    - name: Prepare deployment files
      id: artifact
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          # Add PR info banner for PR previews
          sed -i 's|<div class="container">|<div class="container"><div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 15px; margin: -30px -30px 20px -30px; border-radius: 8px 8px 0 0; text-align: center;"><h3 style="margin: 0; color: white;">📋 PR Preview #${{ github.event.number }}</h3><p style="margin: 5px 0 0 0; opacity: 0.9;">Preview for: <a href="${{ github.event.pull_request.html_url }}" target="_blank" style="color: #fff; text-decoration: underline;">${{ github.event.pull_request.title }}</a></p></div>|' www/index.html
          echo "artifact-name=wasm-demo-pr-${{ github.event.number }}" >> $GITHUB_OUTPUT
        else
          echo "artifact-name=wasm-demo-main" >> $GITHUB_OUTPUT
        fi

    - name: Upload WebAssembly artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.artifact.outputs.artifact-name }}
        path: www/
        retention-days: 30

  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-wasm
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Download WebAssembly artifacts
      uses: actions/download-artifact@v4
      with:
        name: ${{ needs.build-wasm.outputs.artifact-name }}
        path: ./public

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload to GitHub Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./public

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  deploy-pr-preview:
    name: Deploy PR Preview
    runs-on: ubuntu-latest
    needs: build-wasm
    if: github.event_name == 'pull_request'
    steps:
    - name: Download WebAssembly artifacts
      uses: actions/download-artifact@v4
      with:
        name: ${{ needs.build-wasm.outputs.artifact-name }}
        path: ./preview

    - name: Deploy to Netlify
      uses: nwtgck/actions-netlify@v3.0
      with:
        publish-dir: './preview'
        production-deploy: false
        github-token: ${{ secrets.GITHUB_TOKEN }}
        deploy-message: "Deploy from GitHub Actions - PR #${{ github.event.number }}: ${{ github.event.pull_request.title }}"
        alias: "rust-ecs-pr-${{ github.event.number }}"
        enable-pull-request-comment: true
        enable-commit-comment: false
        overwrites-pull-request-comment: true
      env:
        NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      timeout-minutes: 10
      continue-on-error: true

    - name: Comment PR with build status
      if: success() || failure()
      uses: actions/github-script@v7
      with:
        script: |
          const buildStatus = '${{ job.status }}' === 'success' ? '✅ Success' : '❌ Failed';
          const deploymentUrl = process.env.NETLIFY_PREVIEW_URL || 'Not available';
          
          const comment = `## 🦀 WebAssembly Build Status: ${buildStatus}
          
          Your WebAssembly demo has been built successfully!
          
          ${deploymentUrl !== 'Not available' ? `**🔗 [Preview Link](${deploymentUrl})**` : '**Preview deployment is not available** (Netlify secrets not configured)'}
          
          ### Features Available:
          - ✅ Hello World from Rust WebAssembly  
          - ✅ Interactive greeting function
          - ✅ Basic ECS World and Entity creation demo
          - ✅ Real-time console output
          
          ### Manual Testing:
          You can also download the artifacts and test locally:
          1. Download the \`${{ needs.build-wasm.outputs.artifact-name }}\` artifact from this workflow run
          2. Extract and serve with: \`python3 -m http.server 8000\`
          3. Visit \`http://localhost:8000\`
          
          ---
          *This comment was automatically generated by the deployment workflow.*`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });